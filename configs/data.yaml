# Data acquisition and validation configuration.
# All paths are relative to the repository root.

source:
  name: Steel Industry Energy Consumption
  provider: UCI Machine Learning Repository
  dataset_id: 851
  landing_page: https://archive.ics.uci.edu/dataset/851/steel+industry+energy+consumption
  download_url: https://archive.ics.uci.edu/static/public/851/steel+industry+energy+consumption.zip
  doi: 10.24432/C52G8C
  license: CC BY 4.0
  csv_member: Steel_industry_data.csv
  # SHA-256 checksums pinned after the first verified acquisition.
  # A mismatch aborts the pipeline: the upstream file changed or the download is corrupt.
  # Pinned 2026-11-08 after the first acquisition (sizes match the UCI page: 470.7 KB zip, 2.6 MB csv).
  expected_sha256:
    zip: d82d28b33780ff1582507fcf08ae764ff648af459d58234370c551e62aadeaef
    csv: 9b1cee6f9cb9cd9df2b95814ca90a9a2ff15b7f5f1fba0fae3c643e82072eacc

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  figures_dir: reports/figures
  audit_report: reports/data_audit.json

schema:
  timestamp_column: date
  # Explicit format avoids silent day/month inversion (e.g. 01/02/2018).
  timestamp_format: "%d/%m/%Y %H:%M"
  expected_frequency: 15min
  # Raw column name -> canonical snake_case name used across the codebase.
  columns:
    date: timestamp
    Usage_kWh: usage_kwh
    Lagging_Current_Reactive.Power_kVarh: lagging_reactive_kvarh
    Leading_Current_Reactive_Power_kVarh: leading_reactive_kvarh
    CO2(tCO2): co2_tco2
    Lagging_Current_Power_Factor: lagging_power_factor
    Leading_Current_Power_Factor: leading_power_factor
    NSM: nsm
    WeekStatus: week_status
    Day_of_week: day_of_week
    Load_Type: load_type
