[project]
name = "steelops-ai"
version = "0.1.0"
description = "Industrial energy forecasting and decision support for a steel manufacturing facility."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Lorena Melo" }]
dependencies = [
    "holidays>=0.60",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "kaleido>=0.2.1",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steelops"]

[project.scripts]
steelops-download = "steelops.data.download:main"
steelops-audit = "steelops.data.audit:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Exploratory notebooks: long plotting calls, Portuguese text with symbols, pandas reshaping.
"notebooks/*.ipynb" = ["E501", "RUF001", "PD010", "PD011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "raw_data: tests that require the official raw dataset in data/raw (skipped if absent)",
]
